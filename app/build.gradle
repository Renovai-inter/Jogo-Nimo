plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nimo.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.nimo.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // O jogo usa apenas o SDK do Android: nenhuma biblioteca externa é necessária.
}
