name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NimoGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NimoGame-apk
          path: NimoGame.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: NimoGame (build ${{ github.run_number }})
          body: Baixe o NimoGame.apk abaixo e abra no celular Android.
          files: NimoGame.apk
